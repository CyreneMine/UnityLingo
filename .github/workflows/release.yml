name: Publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build
        shell: pwsh
        run: |
          dotnet restore UnityLingo.sln
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build UnityLingo.sln -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run offline verification
        shell: pwsh
        run: dotnet run --project tests/UnityLingo.Tests -c Release --no-build
      - name: Package clean self-contained application
        shell: pwsh
        run: ./scripts/publish.ps1
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" artifacts/UnityLingo-win-x64.zip artifacts/SHA256SUMS.txt --repo "$env:GITHUB_REPOSITORY" --verify-tag --title "UnityLingo $env:GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
